<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbita — Reset password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f3; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .card { background: #fff; border-radius: 18px; padding: 40px 44px; width: 100%; max-width: 420px; box-shadow: 0 4px 32px rgba(0,0,0,.08); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 10px; background: #1b4332; color: #fff; font-size: 20px; font-weight: 900; display: grid; place-items: center; }
    .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; color: #111; }
    .brand small { display: block; font-size: 12px; color: #888; font-weight: 400; }
    h2 { font-size: 22px; font-weight: 800; color: #111; letter-spacing: -.03em; margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    .error-msg { background: #fef2f2; border: 1.5px solid #fca5a5; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
    input[type=password] {
      width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid #d8ddd5; border-radius: 10px;
      outline: none; transition: border-color .15s; background: #fafafa; color: #111;
    }
    input:focus { border-color: #1b4332; background: #fff; }
    button[type=submit] {
      width: 100%; padding: 13px; background: #1b4332; color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; margin-top: 4px;
    }
    button[type=submit]:hover { background: #2d6a4f; }
    button[type=submit]:disabled { opacity: .6; cursor: not-allowed; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; color: #555; }
    .links a { color: #1b4332; font-weight: 700; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .invalid-state { text-align: center; padding: 20px 0; }
    .invalid-state p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div>
        <h1>Orbita</h1>
        <small>Public beta</small>
      </div>
    </div>

    <div id="invalidState" class="invalid-state" style="display:none">
      <h2>Link expired or invalid</h2>
      <p>This password reset link has expired or already been used.<br>Request a new one below.</p>
      <a href="/forgot-password" style="display:inline-block;padding:11px 24px;background:#1b4332;color:#fff;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px;">Request new reset link</a>
    </div>

    <div id="formState">
      <h2>Set a new password</h2>
      <p class="sub">Choose a strong password of at least 12 characters.</p>

      <div id="errorMsg" class="error-msg" style="display:none"></div>

      <form id="resetForm" method="POST" action="/auth/reset-password" novalidate>
        <input type="hidden" name="_csrf" id="csrfField" />
        <input type="hidden" name="token" id="tokenField" />

        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password"
                 autocomplete="new-password" autofocus required placeholder="At least 12 characters" />
        </div>

        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password"
                 autocomplete="new-password" required />
        </div>

        <button type="submit" id="submitBtn">Set new password</button>
      </form>
    </div>

    <div class="links"><a href="/login">Back to sign in</a></div>
  </div>

  <script>
    document.getElementById("csrfField").value = window.__csrf || "";

    const params = new URLSearchParams(location.search);
    const token  = params.get("token") || "";
    const error  = params.get("error");

    if (!token || ["expired", "used", "invalid"].includes(error)) {
      document.getElementById("formState").style.display = "none";
      document.getElementById("invalidState").style.display = "block";
    } else {
      document.getElementById("tokenField").value = token;
      if (error === "too_short") {
        document.getElementById("errorMsg").textContent = "Password must be at least 12 characters.";
        document.getElementById("errorMsg").style.display = "block";
      } else if (error === "mismatch") {
        document.getElementById("errorMsg").textContent = "Passwords do not match.";
        document.getElementById("errorMsg").style.display = "block";
      } else if (error) {
        document.getElementById("errorMsg").textContent = decodeURIComponent(error);
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    document.getElementById("resetForm").addEventListener("submit", e => {
      const pwd     = document.getElementById("new_password").value;
      const confirm = document.getElementById("confirm_password").value;
      const errEl   = document.getElementById("errorMsg");

      let msg = "";
      if (pwd.length < 12)    msg = "Password must be at least 12 characters.";
      else if (pwd !== confirm) msg = "Passwords do not match.";

      if (msg) {
        e.preventDefault();
        errEl.textContent = msg;
        errEl.style.display = "block";
        return;
      }
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "Updating password…";
    });
  </script>
</body>
</html>
