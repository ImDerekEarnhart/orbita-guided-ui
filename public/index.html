<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Orbita guided discovery — private alpha" />
  <title>Orbita — Guided Discovery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="alphaBanner" class="alpha-banner" role="alert">
    <span><strong>Private research alpha</strong> — Do not upload confidential, medical, financial, or proprietary data.</span>
    <a href="mailto:derekearnhart1@gmail.com?subject=Orbita+Alpha+Feedback" class="alpha-feedback">Send feedback</a>
    <form method="POST" action="/auth/logout" style="display:inline" id="logoutForm">
      <input type="hidden" name="_csrf" id="logoutCsrf" />
      <button type="submit" class="alpha-logout">Sign out</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <header class="topbar">
    <a class="brand" href="#/cases" aria-label="Orbita home">
      <span class="brand-mark">O</span>
      <span>
        <strong>Orbita</strong>
        <small>Guided discovery</small>
      </span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/cases"   data-nav="cases">My cases</a>
      <a href="#/new"     data-nav="new">New discovery</a>
      <a href="#/account" data-nav="account">Account</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="app-footer">
    Orbita Private Alpha &middot; Build <span id="buildSha">&hellip;</span>
    &middot; <a href="/health" target="_blank" rel="noopener">Status</a>
    &middot; <a href="mailto:derekearnhart1@gmail.com?subject=Orbita+Data+Deletion+Request">Request data deletion</a>
  </footer>

  <template id="loadingTemplate">
    <section class="center-state">
      <div class="spinner"></div>
      <p>Loading&hellip;</p>
    </section>
  </template>

  <script>
    // ── Diagnostic error reporter ─────────────────────────────────────────────
    (function(){
      var recentFetches = [];
      var origFetch = window.fetch;
      window.fetch = function(input, init){
        var u = (typeof input === "string") ? input : (input && input.url) || String(input);
        var m = (init && init.method) || (input && input.method) || "GET";
        recentFetches.push(m + " " + u);
        if (recentFetches.length > 12) recentFetches.shift();
        return origFetch.apply(this, arguments);
      };
      function report(message, stack, extra){
        try {
          origFetch("/api/debug/client-error", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              message: String(message).slice(0, 500),
              url: location.href,
              stack: String(stack || "").slice(0, 2000),
              extra: Object.assign({ recentFetches: recentFetches }, extra || {}),
            }),
          });
        } catch(_){}
      }
      window.addEventListener("unhandledrejection", function(e){
        var r = e && e.reason;
        report((r && r.message) || r || "unhandledrejection", r && r.stack, { kind: "unhandledrejection" });
      });
      window.addEventListener("error", function(e){
        report((e && e.message) || "error", e && e.error && e.error.stack,
               { kind: "error", filename: e && e.filename, lineno: e && e.lineno });
      });
      window.__reportClientError = report;
    })();

    // Fetch CSRF token + wire logout form; redirect to /login on 401
    fetch("/auth/me").then(r => {
      if (r.status === 401) { location.href = "/login"; return null; }
      return r.json();
    }).then(me => {
      if (!me) return;
      if (me.csrf_token) document.getElementById("logoutCsrf").value = me.csrf_token;
      // Store on window so app.js can read it for API CSRF headers if needed
      window.__me = me;
    }).catch(() => {});

    fetch("/health").then(r => r.json()).then(h => {
      document.getElementById("buildSha").textContent = (h.git_commit || "unknown").slice(0, 7);
    }).catch(() => {});
  </script>
  <script src="app.js"></script>
</body>
</html>
