name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita_test
          POSTGRES_DB: orbita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbita -d orbita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://orbita:orbita_test@localhost:5432/orbita_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run lint
      - run: npm test
